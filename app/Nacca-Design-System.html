@theme {

  --color-nacca-navy-900: #0F172A;
  --color-nacca-accent: #FACC15;

  --color-success: #10B981;
  --color-error: #EF4444;

  --radius-xl: 12px;
  --radius-2xl: 16px;
  --radius-3xl: 24px;
}

@layer base {
  html { font-family: var(--font-body); }
  h1,h2,h3 { font-family: var(--font-display); }
}
