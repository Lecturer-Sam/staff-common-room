# Use the classic node_modules linker instead of Yarn PnP.
#
# Why: Tiptap v3's extension packages (@tiptap/extension-character-count,
# -underline, @tiptap/react) import @tiptap/core and @tiptap/extensions without
# declaring them as dependencies. PnP's strict resolution rejects those imports
# (13 RESOLVE_ERRORs at build time), even though both packages are already in
# yarn.lock as real dependencies of @tiptap/starter-kit. The node_modules
# linker hoists them, so they resolve normally.
#
# Vite also prints a standing warning discouraging PnP. Switching removes that.
#
# After changing this, run:  yarn install
nodeLinker: node-modules
